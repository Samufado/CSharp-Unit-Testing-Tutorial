name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências
        run: dotnet restore src/UnitTestingTutorial.slnx

      - name: Build
        run: dotnet build src/UnitTestingTutorial.slnx --no-restore --configuration Release

      - name: Testes unitários (xUnit) com cobertura
        run: dotnet test src/UnitTestingTutorial.slnx --no-build --configuration Release --verbosity normal --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Copiar relatório de cobertura
        if: always()
        run: find ./TestResults -name "coverage.cobertura.xml" -exec cp {} ./coverage.cobertura.xml \;

      - name: Publicar artefato de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-cobertura-xml
          path: coverage.cobertura.xml
